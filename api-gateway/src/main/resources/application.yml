server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://portfolio-service
          predicates:
            - Path=/api/v1/auth/**
        - id: portfolio-service
          uri: lb://portfolio-service
          predicates:
            - Path=/api/portfolio/**
          filters:
            - StripPrefix=2
        - id: market-data-service
          uri: lb://market-data-service
          predicates:
            - Path=/api/market/**
          filters:
            - StripPrefix=2
        - id: insights-service
          uri: lb://insights-service
          predicates:
            - Path=/api/insights/**
          filters:
            - StripPrefix=2
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=2

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET:change-me-in-production-please-keep-it-long-and-random}
  expiration: 86400000

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
