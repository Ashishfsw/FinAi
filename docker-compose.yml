version: '3.8'

services:
  # PostgreSQL for Portfolio Service
  postgres-portfolio:
    image: pgvector/pgvector:pg16
    container_name: fintech-postgres-portfolio
    environment:
      POSTGRES_DB: portfolio_db
      POSTGRES_USER: fintech
      POSTGRES_PASSWORD: fintech123
    ports:
      - "5432:5432"
    volumes:
      - postgres-portfolio-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintech -d portfolio_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL with PGVector for Insights Service
  postgres-insights:
    image: pgvector/pgvector:pg16
    container_name: fintech-postgres-insights
    environment:
      POSTGRES_DB: insights_db
      POSTGRES_USER: fintech
      POSTGRES_PASSWORD: fintech123
    ports:
      - "5433:5432"
    volumes:
      - postgres-insights-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintech -d insights_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Market Data Cache
  redis:
    image: redis:7-alpine
    container_name: fintech-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka for Event-Driven Communication
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: fintech-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: fintech-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Kafka UI for monitoring
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: fintech-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: fintech-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

volumes:
  postgres-portfolio-data:
  postgres-insights-data:
  redis-data:

networks:
  default:
    name: fintech-network
